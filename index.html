<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#52C41A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="雨宝的工作台" />
<script>
/* 首屏即时上色：在 CSS/JS 解析前先填上主题背景，消除白屏闪烁 */
(function(){try{
  var raw=localStorage.getItem('yubao_workbench_v1');
  var theme='system';
  if(raw){var s=JSON.parse(raw).settings;if(s&&s.theme)theme=s.theme;}
  var dark=theme==='dark'||(theme!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.style.background=dark?'#0f150e':'#eef5ee';
}catch(e){}})();
</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<title>雨宝工作台</title>
<style>
/* ============ 配色体系 ============ */
:root{
  --primary:#52C41A; --primary-soft:#eaf7e1; --primary-strong:#3f9713;
  --accent:#2E7D32; --accent-soft:#E8F5E9; --danger:#5d8a66; --danger-soft:#e6f0ea;
  --bg:#eef5ee; --card:#ffffff; --text:#1f2d1f; --text-2:#5a6b58; --text-3:#8a9a88;
  --border:#e2ece2; --shadow:0 2px 10px rgba(60,120,40,.07); --shadow-lg:0 10px 30px rgba(60,120,40,.14);
  --radius:16px; --radius-sm:10px;
  --heat-0:#ebf1eb; --heat-1:#c4ebab; --heat-2:#8fd66a; --heat-3:#5cb83a; --heat-4:#2f7d12;
}
[data-theme="dark"]{
  --primary:#6fcf3f; --primary-soft:#1e2e18; --primary-strong:#8fe05a;
  --accent:#43A047; --accent-soft:#1B3A1A; --danger:#7da688; --danger-soft:#1f3024;
  --bg:#0f150e; --card:#182218; --text:#e6f0e4; --text-2:#a9bba6; --text-3:#75876f;
  --border:#26341f; --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --heat-0:#1c271a; --heat-1:#2f4d23; --heat-2:#3f6b2c; --heat-3:#4f8c36; --heat-4:#6fbf3f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
}
button{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ============ 布局 ============ */
#app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;gap:4px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 14px;cursor:pointer}
.brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#8be05a);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;font-weight:800;font-size:20px}
.brand .bn{font-size:17px;font-weight:800;letter-spacing:.5px}
.brand .bs{font-size:11px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);cursor:pointer;font-size:14px;font-weight:600;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:var(--primary-soft)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ico{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.nav-item .ico svg{width:22px;height:22px}
.side-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.theme-btn{display:flex;align-items:center;gap:10px;justify-content:center;padding:9px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text-2);cursor:pointer;font-size:13px}
.theme-btn:hover{border-color:var(--primary);color:var(--primary-strong)}
.theme-btn svg{width:18px;height:18px}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar h1{font-size:18px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--text-3)}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--card);cursor:pointer}
.conn .dot{width:9px;height:9px;border-radius:50%}
.conn.off .dot{background:var(--text-3)} .conn.off{color:var(--text-3)}
.conn.connected .dot{background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.conn.connected{color:var(--primary-strong)}
.conn.err .dot{background:var(--accent)} .conn.err{color:var(--accent)}
.conn.sync{background:var(--accent-soft)} .conn.sync .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.menu-toggle{display:none}

.view{padding:22px 26px 70px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card .cs{font-size:12px;color:var(--text-3);font-weight:400;margin-left:auto}
.jump{cursor:pointer;transition:box-shadow .15s,transform .15s}
.jump:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.enter{font-size:12px;color:var(--primary-strong);font-weight:600;margin-left:auto}
.enter.sm{margin-left:0;margin-top:6px;font-size:11px;opacity:.7}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.mt{margin-top:18px} .muted{color:var(--text-3)} .small{font-size:12px}

/* 首页 */
.energy{display:flex;align-items:center;gap:14px}
.energy .qm{width:46px;height:46px;border-radius:12px;flex:0 0 46px;background:var(--primary-soft);color:var(--primary-strong);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.energy .zh{font-size:16px;font-weight:700} .energy .en{font-size:12px;color:var(--text-3);font-style:italic;margin-top:2px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .num{font-size:26px;font-weight:800;color:var(--primary-strong);font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:12px;color:var(--text-3)}
.checkin-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ci{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:all .15s;background:var(--card)}
.ci:hover{border-color:var(--primary)} .ci .ci-ico{width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.ci .ci-ico svg{width:26px;height:26px} .ci .ci-n{font-size:13px;font-weight:600}
.ci .ci-st{margin-left:auto;font-size:11px;color:var(--text-3)}
.ci.done{background:var(--primary-soft);border-color:var(--primary)} .ci.done .ci-st{color:var(--primary-strong);font-weight:700}
.badge{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-left:auto}
.ci.done .badge{background:var(--primary);border-color:var(--primary)} .ci.done .badge svg{width:13px;height:13px;color:#fff}
.countdown{background:linear-gradient(135deg,var(--primary),#8be05a);color:#fff;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.countdown .cd-days{font-size:44px;font-weight:800;line-height:1} .countdown .cd-l{font-size:13px;opacity:.92;margin-top:6px}
.countdown .cd-n{font-size:15px;font-weight:700;margin-top:4px}
.countdown .plane{position:absolute;right:14px;top:14px;opacity:.35} .countdown .plane svg{width:54px;height:54px}

/* 表单 */
.fr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--text-2);font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;width:100%} input[type=number]{width:120px}
.btn{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;border-radius:var(--radius-sm);
  padding:10px 18px;background:var(--primary);color:#fff;transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--bg);color:var(--text-2);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary-strong)}
.btn.danger{background:var(--danger)} .btn.sm{padding:5px 11px;font-size:12px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)} .tab.active{color:var(--primary-strong);border-bottom-color:var(--primary)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi-box{background:var(--primary-soft);border-radius:var(--radius-sm);padding:16px;text-align:center;border:1px solid var(--border)}
.kpi-box .v{font-size:28px;font-weight:800;color:var(--primary-strong);font-variant-numeric:tabular-nums}
.kpi-box .l{font-size:12px;color:var(--text-2);margin-top:4px}

.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.table th{color:var(--text-3);font-weight:600;font-size:12px}
.table tr:hover td{background:var(--bg)}
.table .num{font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.tag.warn{background:var(--accent-soft);color:var(--accent)} .tag.gray{background:var(--bg);color:var(--text-3)}
.empty{text-align:center;color:var(--text-3);padding:26px;font-size:13px}
/* 行程规划按天展示 */
.plan-day{border-left:3px solid var(--primary);background:var(--bg);border-radius:0 9px 9px 0;padding:10px 12px;margin-bottom:8px}
.plan-day-h{font-weight:700;color:var(--primary-strong);margin-bottom:3px}
.plan-day-c{font-size:13px;color:var(--text-2);white-space:pre-wrap;line-height:1.55}
.plan-raw{white-space:pre-wrap;color:var(--text-2);font-size:13px;line-height:1.6}
/* 爆款素材卡片 */
.hot-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--card);cursor:pointer;transition:border .15s}
.hot-card:hover{border-color:var(--primary)}
.hot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.hot-toggle{margin-top:8px;font-size:12px;color:var(--primary-strong);font-weight:600;text-align:right;user-select:none}
/* 平台热榜快捷按钮 */
.hot-link-btn{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--card);text-decoration:none;color:var(--text);
  transition:all .18s;cursor:pointer}
.hot-link-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(46,125,50,.12)}
.hl-icon{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.hl-icon svg{width:20px;height:20px}
.hl-text{flex:1;font-size:14px;font-weight:700}
.hl-arrow{color:var(--text-3);font-weight:700;font-size:16px}
.sub-h{font-size:13px;font-weight:700;color:var(--primary-strong)}
.box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text-2);white-space:pre-wrap;line-height:1.6}

.progress{height:13px;background:var(--bg);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#8be05a);border-radius:20px;transition:width .4s}

/* 历史折叠 */
details.day{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;background:var(--card)}
details.day>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .chev{width:16px;height:16px;color:var(--text-3);transition:transform .2s}
details.day[open]>summary .chev{transform:rotate(90deg)}
details.day>summary .cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:500}
.day-body{padding:0 14px 12px}
.del{color:var(--danger);cursor:pointer;font-size:12px;font-weight:600}

/* 图表 */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--text-3);font-size:10px}
.chart .line{stroke:var(--primary);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--primary);opacity:.12} .chart .dot{fill:var(--primary)}
.chart .bar{fill:var(--primary)} .chart .pie-empty{fill:var(--bg);stroke:var(--border)}
.chart .pie-center{fill:var(--text);font-size:17px;font-weight:800}
.heat{stroke:var(--card);stroke-width:1}
.heat-0{fill:var(--heat-0)} .heat-1{fill:var(--heat-1)} .heat-2{fill:var(--heat-2)} .heat-3{fill:var(--heat-3)} .heat-4{fill:var(--heat-4)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 心情 */
.moods{display:flex;gap:10px;flex-wrap:wrap}
.mood{font-size:26px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid var(--border);background:var(--bg);transition:all .15s}
.mood.sel{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.08)}

/* 悬浮备份 */
.fab{position:fixed;right:24px;bottom:24px;z-index:60;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
  background:var(--primary);color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.08)} .fab svg{width:26px;height:26px}
.fab-menu{position:fixed;right:24px;bottom:90px;z-index:60;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;display:none;min-width:190px}
.fab-menu.open{display:block}
.fab-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:none;
  background:transparent;color:var(--text);cursor:pointer;border-radius:9px;font-size:13px;font-weight:600}
.fab-menu button:hover{background:var(--primary-soft);color:var(--primary-strong)}
.fab-menu button svg{width:18px;height:18px}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal .hint{font-size:12px;color:var(--text-3);background:var(--bg);border-radius:8px;padding:10px;margin-top:10px;line-height:1.6}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:100;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .25s,top .25s;pointer-events:none}
.toast.show{opacity:1;top:30px}

/* ============ 手机引导页 ============ */
.guide-wrap{display:flex;justify-content:center;padding:20px}
.phone{width:380px;max-width:100%;background:#f8f1e6;border-radius:34px;box-shadow:var(--shadow-lg);overflow:hidden;border:8px solid #2b2b2b;display:flex;flex-direction:column;min-height:760px}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;color:#333;font-size:13px;font-weight:600}
.statusbar .sb-r{display:flex;align-items:center;gap:6px}
.statusbar svg{width:16px;height:16px}
.guide-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 22px 14px;text-align:center}
.guide-banner{background:var(--accent);color:#fff;border-radius:14px;padding:14px 16px;font-size:24px;font-weight:800;
  width:100%;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px}
.app-icon{width:120px;height:120px;border-radius:28px;background:linear-gradient(135deg,var(--primary),#8be05a);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:62px;font-weight:800;margin:34px 0 12px;box-shadow:0 10px 24px rgba(82,196,26,.4)}
.app-name{font-size:20px;font-weight:800;color:#333}
.app-note{font-size:13px;color:#9a8f7d;margin-top:6px}
.guide-tip{margin-top:auto;font-size:12px;color:#9a8f7d;background:#fff;border-radius:12px;padding:14px;width:100%;line-height:1.7;text-align:left}
.dock{height:78px;background:rgba(255,255,255,.6);backdrop-filter:blur(14px);border-top:1px solid rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:space-around;padding:0 22px;margin:8px}
.dock .d{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#444}
.dock .d svg{width:26px;height:26px} .dock .d.round{background:var(--primary);color:#fff;width:50px;height:50px}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
    border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text-2)}
  .menu-toggle svg{width:20px;height:20px}
  .g2,.g3,.g4,.kanban{grid-template-columns:1fr}
  .checkin-wall{grid-template-columns:repeat(2,1fr)}
  .view{padding:16px}
  .fr .field{flex:1 1 100%;min-width:0!important}
  .fr .btn:not(.sm){width:100%;padding:12px 16px;font-size:15px;justify-content:center}
  .card{padding:14px;margin-bottom:14px}
  .kpi-box{padding:14px}
  .hot-link-btn{padding:14px;font-size:14px}
  .tabs .tab{padding:9px 12px;font-size:12px}
}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39;display:none}
.overlay.show{display:block}

.book-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px}
.book-item.done{opacity:.6}
.book-ico{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary-strong);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.book-main{flex:1;min-width:0}
.book-title{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.book-acts{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.kpi-box.hl{background:var(--primary-strong);border-color:var(--primary-strong)}
.kpi-box.hl .v,.kpi-box.hl .l{color:#fff}
.tag.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.prog{height:10px;background:var(--accent-soft,#E8F5E9);border-radius:6px;overflow:hidden;margin:6px 0}.prog-bar{height:100%;background:var(--accent,#2E7D32);border-radius:6px;transition:width .35s}
/* 每日单词打卡 */
.daily-words .dw-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.daily-words .dw-streak,.daily-words .dw-prog{font-size:13px;color:var(--text-2);background:var(--primary-soft,#E8F5E9);padding:5px 12px;border-radius:20px}
.daily-words .dw-streak b,.daily-words .dw-prog b{color:var(--primary-strong,#2E7D32);font-size:15px}
.word-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.word-card{background:var(--bg,#fff);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s;position:relative}
.word-card:hover{border-color:var(--primary,#2E7D32);box-shadow:0 3px 12px rgba(46,125,50,.12)}
.word-card.learned{background:var(--accent-soft,#E8F5E9);border-color:var(--accent,#2E7D32)}
.word-card.learned .word-w{text-decoration:line-through;opacity:.7}
.word-top{display:flex;align-items:flex-start;gap:10px}
.word-spk{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--primary-soft,#E8F5E9);color:var(--primary-strong,#2E7D32);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.word-spk svg{width:18px;height:18px}
.word-spk:active{transform:scale(.92)}
.word-head{flex:1;min-width:0}
.word-w{font-size:18px;font-weight:700;color:var(--text-1);letter-spacing:.3px}
.word-pos{font-size:11px;font-weight:400;color:var(--text-3);margin-left:6px}
.word-ph{font-size:12px;color:var(--text-3);margin-top:2px;font-family:'Cambria','Times New Roman',serif}
.word-check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-3);font-weight:700}
.word-check.on{background:var(--accent,#2E7D32);border-color:var(--accent,#2E7D32);color:#fff}
.word-cn{font-size:13px;color:var(--text-2);margin-top:8px}
.word-ex{font-size:13px;color:var(--text-1);margin-top:6px;font-style:italic}
.word-zh{font-size:12px;color:var(--text-3);font-style:normal;margin-top:2px}
.dw-all{margin-top:14px}
.dw-done{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft,#E8F5E9);color:var(--primary-strong,#2E7D32);font-weight:600;text-align:center}
.word-acts{margin-top:8px}
.word-wrong{display:inline-block;font-size:12px;color:var(--text-3);cursor:pointer;user-select:none;border:1px solid var(--border);padding:2px 10px;border-radius:20px}
.word-wrong.on{background:#fdecea;color:#c0392b;border-color:#f5c6c0}
.wrong-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.wrong-item:last-child{border-bottom:none}
.word-spk.sm{width:30px;height:30px;flex:0 0 auto}
.word-spk.sm svg{width:15px;height:15px}
.wrong-main{flex:1;min-width:0}
.word-master{font-size:12px;color:var(--accent,#2E7D32);cursor:pointer;border:1px solid var(--accent,#2E7D32);padding:3px 10px;border-radius:20px;white-space:nowrap}
.flip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.flip{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--bg,#fff);transition:border-color .2s,box-shadow .2s}
.flip:hover{border-color:var(--primary,#2E7D32)}
.flip-face{width:100%}
.flip-cn{font-size:16px;font-weight:600;color:var(--text-1)}
.flip-hint{font-size:12px;color:var(--text-3);margin-top:6px}
.flip-back .word-w{font-size:18px}
.flip-back .word-spk{margin:8px auto 0}
.flip-acts{display:flex;gap:8px;justify-content:center;margin-top:8px}
.flip-acts .word-wrong{font-size:12px}
@media(max-width:860px){.word-grid{grid-template-columns:1fr}.flip-grid{grid-template-columns:1fr}}

/* ---------- 替换页面中的 data-ico 占位 ---------- */

/* ============================================================
   美式发音（Web Speech API，免费、无需后端）
   ============================================================ */
let US_VOICE=null;
function pickUSVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=speechSynthesis.getVoices()||[];
  return vs.find(v=>/^en[-_]US$/i.test(v.lang))
      || vs.find(v=>/^en/i.test(v.lang)&&/US|America|United States/i.test(v.name))
      || vs.find(v=>/^en/i.test(v.lang)) || null;
}
function speakWord(text){
  if(!('speechSynthesis' in window)){toast('当前浏览器不支持发音');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const v=pickUSVoice(); if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast('发音失败：'+(e&&e.message||e));}
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>{US_VOICE=pickUSVoice();};
  US_VOICE=pickUSVoice();
}

/* ============================================================
   数据层（LocalStorage，自动保存）
   ============================================================ */
const KEY='yubao_workbench_v1';
const DEFAULT={
  version:1, settings:{theme:'system'}, checkins:{},
  sideHustle:{iso:[],media:[],other:[]},
  english:[], reading:[], exercise:[],
  mediaPlan:[], videos:[], favHot:[], goals:{readingYear:12, sideMonth:0, engWeek:0},
  engWords:{done:{},wrong:[]},
  travel:{trips:[],wishlist:[],itineraries:[],rates:{},plan:''},
  reviews:{}
};
function deepMerge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)?over:base;
  if(base&&typeof base==='object'){
    const out=Array.isArray(base)?[]:{};
    for(const k of Object.keys(base)) out[k]=(over&&k in over)?deepMerge(base[k],over[k]):base[k];
    if(over&&typeof over==='object'&&!Array.isArray(over))
      for(const k of Object.keys(over)) if(!(k in out)) out[k]=over[k];
    return out;
  }
  return over===undefined?base:over;
}
let DATA=load();
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return deepMerge(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(raw));}catch(e){console.warn(e);}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){console.error(e);toast('保存失败：存储空间可能已满');}
  scheduleSync();
}
function get(path){return path.split('.').reduce((o,k)=>o?o[k]:undefined,DATA);}
function push(path,item){get(path).push(item);save();}
function remove(path,pred){const a=get(path);const i=a.findIndex(pred);if(i>=0){a.splice(i,1);save();}}
function update(path,pred,patch){const a=get(path);const i=a.findIndex(pred);if(i>=0){a[i]={...a[i],...patch};save();}}

const D={
  today(){return this.fmt(new Date());},
  fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;},
  parse(s){const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d);},
  startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;},
  startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);},
  addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;},
  daysBetween(a,b){return Math.round((D.parse(b)-D.parse(a))/86400000);},
  lastNDays(n){const o=[];const t=new Date();for(let i=n-1;i>=0;i--)o.push(this.fmt(this.addDays(t,-i)));return o;},
  thisWeekDays(){const s=this.startOfWeek(new Date());const o=[];for(let i=0;i<7;i++)o.push(this.fmt(this.addDays(s,i)));return o;},
  thisMonthDays(){const s=this.startOfMonth(new Date());const o=[];const t=new Date();while(s<=t){o.push(this.fmt(s));s.setDate(s.getDate()+1);}return o;},
  weekday(s){return ['周日','周一','周二','周三','周四','周五','周六'][this.parse(s).getDay()];},
  pretty(s){const d=this.parse(s);return `${d.getMonth()+1}月${d.getDate()}日 ${this.weekday(s)}`;}
};

/* ============================================================
   纯 SVG 图表（无外部依赖）
   ============================================================ */
const Charts={
  line(series,opts={}){
    const w=opts.width||640,h=opts.height||220,pad={l:42,r:14,t:16,b:26};
    const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,max=Math.max(1,...series),n=series.length;
    const X=i=>pad.l+(n<=1?iw/2:(i*iw)/(n-1)),Y=v=>pad.t+ih-(v/max)*ih;
    let g='';for(let s=0;s<=4;s++){const gv=max/4*s,gy=Y(gv);g+=`<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" class="grid"/><text x="${pad.l-6}" y="${gy+4}" class="axis" text-anchor="end">${Math.round(gv)}</text>`;}
    let area='',poly='',dots='';
    if(n>0){const pts=series.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
      poly=`<polyline points="${pts.join(' ')}" fill="none" class="line"/>`;
      area=`<polygon points="${pad.l},${Y(0)} ${pts.join(' ')} ${X(n-1)},${Y(0)}" class="area"/>`;
      dots=series.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" class="dot"><title>${v}</title></circle>`).join('');}
    let xl='';if(n>1){const ev=Math.ceil(n/6);for(let i=0;i<n;i+=ev)xl+=`<text x="${X(i).toFixed(1)}" y="${h-8}" class="axis" text-anchor="middle">${i+1}</text>`;}
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${area}${poly}${dots}${xl}</svg>`;
  },
  bar(items,opts={}){
    const w=opts.width||640,h=opts.height||220,pad={l:42,r:14,t:16,b:30};
    const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,max=Math.max(1,...items.map(d=>d.value)),n=items.length||1;
    const bw=iw/n*0.6,gap=iw/n;let g='',b='';
    for(let s=0;s<=4;s++){const gv=max/4*s,gy=pad.t+ih-(gv/max)*ih;g+=`<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" class="grid"/><text x="${pad.l-6}" y="${gy+4}" class="axis" text-anchor="end">${Math.round(gv)}</text>`;}
    items.forEach((d,i)=>{const bh=(d.value/max)*ih,bx=pad.l+gap*i+(gap-bw)/2,by=pad.t+ih-bh;
      b+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" class="bar"><title>${d.label}: ${d.value}</title></rect>`;
      b+=`<text x="${(bx+bw/2).toFixed(1)}" y="${h-12}" class="axis" text-anchor="middle">${d.label}</text>`;});
    return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${b}</svg>`;
  },
  pie(segs,opts={}){
    const size=opts.size||210,r=size/2-8,cx=size/2,cy=size/2;
    const total=segs.reduce((s,x)=>s+x.value,0);
    if(total<=0)return `<svg viewBox="0 0 ${size} ${size}" class="chart"><circle cx="${cx}" cy="${cy}" r="${r}" class="pie-empty"/><text x="${cx}" y="${cy+4}" class="axis" text-anchor="middle">暂无数据</text></svg>`;
    let acc=0,p='';const colors=['#52C41A','#8be05a','#3f9713','#FF4A1F','#faad14','#36cfc9'];
    segs.forEach((seg,i)=>{const frac=seg.value/total,a0=acc*2*Math.PI-Math.PI/2;acc+=frac;const a1=acc*2*Math.PI-Math.PI/2;
      const large=frac>0.5?1:0,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      p+=`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${seg.color||colors[i%colors.length]}" stroke="var(--card)" stroke-width="2"><title>${seg.label}: ${seg.value}</title></path>`;});
    p+=`<text x="${cx}" y="${cy-3}" class="pie-center" text-anchor="middle">${total.toFixed(0)}</text>`;
    p+=`<text x="${cx}" y="${cy+14}" class="axis" text-anchor="middle">${opts.center||'总计'}</text>`;
    return `<svg viewBox="0 0 ${size} ${size}" class="chart">${p}</svg>`;
  },
  heatmap(map,opts={}){
    const year=opts.year||new Date().getFullYear(),cell=13,gap=3,padL=30,padT=18,weeks=53;
    const w=padL+weeks*(cell+gap)+4,h=padT+7*(cell+gap)+4,off=(new Date(year,0,1).getDay()+6)%7;
    let cells='',ml='',lm=-1;
    for(let wk=0;wk<weeks;wk++)for(let dy=0;dy<7;dy++){
      const d=new Date(year,0,1+wk*7+dy-off);if(d.getFullYear()!==year)continue;
      const key=D.fmt(d),val=map[key]||0;
      const lv=val<=0?0:val<30?1:val<60?2:val<120?3:4;
      cells+=`<rect x="${padL+wk*(cell+gap)}" y="${padT+dy*(cell+gap)}" width="${cell}" height="${cell}" rx="3" class="heat heat-${lv}"><title>${key}: ${val}</title></rect>`;
      const fd=new Date(year,0,1+wk*7-off);
      if(fd.getFullYear()===year&&fd.getMonth()!==lm){lm=fd.getMonth();ml+=`<text x="${padL+wk*(cell+gap)}" y="12" class="axis">${fd.getMonth()+1}月</text>`;}
    }
    const dl=['','一','','三','','五',''].map((t,dy)=>t?`<text x="6" y="${padT+dy*(cell+gap)+cell-2}" class="axis">${t}</text>`:'').join('');
    return `<svg viewBox="0 0 ${w} ${h}" class="chart heatmap" preserveAspectRatio="xMinYMin meet">${ml}${dl}${cells}</svg>`;
  }
};

/* ============================================================
   Supabase 云端同步（可选，无网络不影响本地使用）
   ============================================================ */
const SBKEY='yubao_supabase_cfg';
let sbClient=null,sbStatus='off',sbCfg=null,sbTimer=null,sbRowId=null;
function loadSbCfg(){try{sbCfg=JSON.parse(localStorage.getItem(SBKEY)||'null');}catch(e){sbCfg=null;}}
function setSbStatus(s,t){sbStatus=s;const b=document.getElementById('connBtn'),t1=document.getElementById('connText');
  b.className='conn '+(s==='connected'?'connected':s==='err'?'err':s==='sync'?'sync':'off');
  t1.textContent=t||(s==='connected'?'云端已连接':s==='err'?'连接异常':s==='sync'?'同步中…':'云端未连接');}
function loadSbScript(cb){
  if(window.supabase)return cb();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=()=>cb();s.onerror=()=>cb(new Error('cdn'));
  document.head.appendChild(s);
}
function connectSupabase(){
  if(!sbCfg||!sbCfg.url||!sbCfg.key){setSbStatus('off');return;}
  setSbStatus('sync','连接中…');
  loadSbScript(err=>{
    if(err||!window.supabase){setSbStatus('err','CDN 不可用');return;}
    try{ sbClient=window.supabase.createClient(sbCfg.url,sbCfg.key); }
    catch(e){ setSbStatus('err',e.message.slice(0,20)); return; }
    getSyncRowId().then(rowId=>{
      sbRowId=rowId;
      sbClient.from('yubao_data').select('payload,updated_at').eq('id',rowId).maybeSingle()
      .then(({data,error})=>{
        if(error){setSbStatus('err',error.message.slice(0,20));return;}
        if(data&&data.payload){
          try{importJSON(JSON.stringify(data.payload));render();}catch(e){}
          finishConnect();
        }else{
          // 本空间为空：尝试从旧公共行 'me' 迁移（仅首次，避免朋友误读你的数据）
          sbClient.from('yubao_data').select('payload,updated_at').eq('id','me').maybeSingle()
          .then(({data:m})=>{
            if(m&&m.payload){
              try{importJSON(JSON.stringify(m.payload));render();}catch(e){}
              sbClient.from('yubao_data').upsert({id:rowId,payload:DATA,updated_at:new Date().toISOString()})
               .then(()=>{ sbClient.from('yubao_data').delete().eq('id','me').then(()=>{}).catch(()=>{}); toast('已迁移旧云端数据并隔离'); })
               .catch(()=>{});
            }
            finishConnect();
          }).catch(()=>finishConnect());
        }
      }).catch(e=>setSbStatus('err',e.message.slice(0,20)));
    }).catch(e=>setSbStatus('err','密钥处理失败'));
  });
}
function finishConnect(){
  setSbStatus('connected');
  try{sbClient.channel('yubao').on('postgres_changes',{event:'*',schema:'public',table:'yubao_data'},()=>pull()).subscribe();}catch(e){}
}
function pull(){
  if(!sbClient||!sbRowId)return;
  sbClient.from('yubao_data').select('payload,updated_at').eq('id',sbRowId).maybeSingle()
   .then(({data,error})=>{ if(!error&&data&&data.payload){try{importJSON(JSON.stringify(data.payload));render();}catch(e){}} })
   .catch(()=>{});
}
function scheduleSync(){
  if(sbStatus!=='connected'||!sbClient||!sbRowId)return;
  clearTimeout(sbTimer);
  sbTimer=setTimeout(()=>{
    setSbStatus('sync');
    sbClient.from('yubao_data').upsert({id:sbRowId,payload:DATA,updated_at:new Date().toISOString()})
      .then(()=>setSbStatus('connected')).catch(()=>setSbStatus('err','同步失败'));
  },800);
}
function getDeviceId(){
  let id=localStorage.getItem('yubao_device_id');
  if(!id){id=(crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Date.now()+Math.random().toString(16).slice(2));localStorage.setItem('yubao_device_id',id);}
  return id;
}
async function sha256(s){
  try{ if(crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');} }catch(e){}
  return 'h'+simpleHash(s);
}
function simpleHash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(16);}
async function getSyncRowId(){
  const space=(sbCfg&&sbCfg.space)?sbCfg.space.trim():'';
  if(space) return 'k_'+await sha256('yubao:'+space);
  return 'd_'+getDeviceId();
}

/* 历史记录按日期折叠 */
function historyByDate(records){
  const groups={};
  records.forEach(r=>{const d=r.date||'?';(groups[d]=groups[d]||[]).push(r);});
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a));
}
function historyBlock(records,cols,path){
  const dates=historyByDate(records);
  if(!dates.length)return `<div class="empty">暂无记录，从上方表单添加 ✦</div>`;
  let html='';
  dates.forEach(d=>{
    const items=records.filter(r=>r.date===d);
    const rows=items.map(r=>{
      const cells=cols.map(c=>`<td>${c.render?c.render(r):(r[c.k]??'')}</td>`).join('');
      return `<tr><td class="num" style="color:var(--text-3)">${r._t||''}</td>${cells}<td><span class="del" data-del="${r.id}">删除</span></td></tr>`;
    }).join('');
    html+=`<details class="day" open><summary><span class="chev">${ico('chev')}</span>${D.pretty(d)} <span class="cnt">${items.length} 条</span></summary>
      <div class="day-body"><table class="table"><thead><tr><th>时间</th>${cols.map(c=>`<th>${c.t}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  });
  return html;
}

const WORD_ANCHOR='2026-07-29';
function todayWordSet(){
  const total=B1_WORDS.length;
  const groups=Math.max(1,Math.ceil(total/10));
  const dayIdx=Math.max(0,D.daysBetween(WORD_ANCHOR,D.today()));
  const g=((dayIdx%groups)+groups)%groups;
  const start=g*10;
  return B1_WORDS.slice(start,start+10).map((w,i)=>Object.assign({},w,{gi:start+i}));
}
function wordStreak(){
  let streak=0; let d=new Date();
  if(!(DATA.engWords.done[D.fmt(d)]&&DATA.engWords.done[D.fmt(d)].length)) d=D.addDays(d,-1);
  while(DATA.engWords.done[D.fmt(d)]&&DATA.engWords.done[D.fmt(d)].length){streak++;d=D.addDays(d,-1);}
  return streak;
}
function renderDailyWords(){
  const today=D.today();
  const set=todayWordSet();
  const doneSet=new Set((DATA.engWords.done[today]||[]));
  const wrongSet=new Set(DATA.engWords.wrong||[]);
  const learned=set.filter(w=>doneSet.has(w.gi)).length;
  const allDone=learned>=set.length;
  const streak=wordStreak();
  const cards=set.map(w=>{
    const isL=doneSet.has(w.gi);
    const isW=wrongSet.has(w.gi);
    return `<div class="word-card ${isL?'learned':''}" data-wordtoggle="${w.gi}">
      <div class="word-top">
        <button type="button" class="word-spk" data-spk="${w.w}" title="点击发音（美式）" aria-label="发音">${ico('sound')}</button>
        <div class="word-head">
          <div class="word-w">${w.w} <span class="word-pos">${w.pos}</span></div>
          <div class="word-ph">${w.ph}</div>
        </div>
        <div class="word-check ${isL?'on':''}">${isL?'✓':'○'}</div>
      </div>
      <div class="word-cn">${w.cn}</div>
      <div class="word-ex">${w.ex}<div class="word-zh">${w.zh}</div></div>
      <div class="word-acts"><span class="word-wrong ${isW?'on':''}" data-wrong="${w.gi}">${isW?'❌ 已在错词本':'没记住？点这'}</span></div>
    </div>`;
  }).join('');
  return `<div class="card daily-words">
    <h3>每日单词打卡 <span class="cs">B1 口语 · 今日推送 ${set.length} 个</span></h3>
    <div class="dw-bar">
      <div class="dw-streak">🔥 连续打卡 <b>${streak}</b> 天</div>
      <div class="dw-prog">今日已掌握 <b>${learned}/${set.length}</b></div>
    </div>
    <div class="word-grid">${cards}</div>
    ${allDone
      ? `<div class="dw-done">🎉 今日 ${set.length} 词全部掌握，打卡完成！明天见～</div>`
      : `<button type="button" class="btn sm dw-all" data-daycheck>一键完成今日打卡（全部标记已会）</button>`}
    <div class="muted small" style="margin-top:8px">点击 🔊 听美式发音；点击卡片标记「已会」；记不住就点「没记住」收进错词本。</div>
  </div>`;
}
/* 已学单词集合（跨日期去重） */
function learnedSet(){
  const s=new Set();
  const done=DATA.engWords.done||{};
  Object.keys(done).forEach(d=>Array.isArray(done[d])&&done[d].forEach(g=>s.add(g)));
  return s;
}
/* 错词本 */
function renderWrongWords(){
  const wrong=DATA.engWords.wrong||[];
  const items=wrong.map(gi=>({w:B1_WORDS[gi],gi})).filter(x=>x.w);
  const inner=items.length?items.map(x=>`
    <div class="wrong-item">
      <button type="button" class="word-spk sm" data-spk="${x.w.w}" title="发音" aria-label="发音">${ico('sound')}</button>
      <div class="wrong-main">
        <div class="word-w">${x.w.w} <span class="word-pos">${x.w.pos}</span></div>
        <div class="word-ph">${x.w.ph}</div>
      </div>
      <div class="word-cn">${x.w.cn}</div>
      <span class="word-master" data-review-master="${x.gi}">✓ 已掌握</span>
    </div>`).join('')
    : `<div class="empty">还没有错词，继续保持 💪</div>`;
  return `<div class="card">
    <h3>错词本 <span class="cs">${items.length} 个待巩固</span></h3>
    ${inner}
  </div>`;
}
/* 复习打卡：优先错词本，没有则复习已学单词；翻牌自测 */
function reviewItems(){
  const wrong=(DATA.engWords.wrong||[]).slice();
  const gis=wrong.length?wrong:Array.from(learnedSet());
  return Array.from(new Set(gis)).slice(0,20).map(gi=>B1_WORDS[gi]).filter(Boolean);
}
function renderReviewWords(){
  const items=reviewItems();
  if(!items.length) return `<div class="card"><h3>复习打卡</h3><div class="empty">先学几天单词，再来复习吧 ✦</div></div>`;
  const cards=items.map(w=>{
    const gi=B1_WORDS.indexOf(w);
    return `<div class="flip" data-flip="${gi}">
      <div class="flip-face flip-front">
        <div class="flip-cn">${w.cn}</div>
        <div class="flip-hint">点击看英文 ↻</div>
      </div>

          <span class="word-wrong" data-wrong="${gi}">还不会</span>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h3>复习打卡 <span class="cs">${items.length} 张 · 看中文回想英文</span></h3>

  </div>`;
}

/* 行程规划：将整段文本按「第X天」拆成每天纵向展示 */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderPlan(text){
  if(!text||!text.trim())return '<div class="empty">在上方粘贴或输入整段行程，系统会自动按「第X天」拆成每天安排</div>';
  const re=/第\s*([一二三四五六七八九十百零\d]+)\s*天/g;
  const ms=[...text.matchAll(re)];
  if(!ms.length)return '<div class="muted small" style="margin-bottom:6px">未检测到「第X天」格式，已原样展示：</div><div class="plan-raw">'+esc(text)+'</div>';
  let html='';
  ms.forEach((mm,i)=>{
    const start=mm.index+mm[0].length;
    const end=(ms[i+1]?ms[i+1].index:text.length);
    let content=text.slice(start,end).replace(/^[\s：:，,、\-\—]+/,'').replace(/\s+$/,'');
    html+=`<div class="plan-day"><div class="plan-day-h">${mm[0]}</div><div class="plan-day-c">${esc(content)||'（未填写）'}</div></div>`;
  });
  return html;
}

function buildReport(){
  const now=new Date();const dow=now.getDay();const date=D.today();
  let title=null,start,end,key;
  if(dow===1){ // 周一 → 上周
    start=D.fmt(D.addDays(D.startOfWeek(now),-7));end=D.fmt(D.addDays(D.startOfWeek(now),-1));title='上周周报';key='week';
  }else if(now.getDate()===1){ // 每月1号 → 上月
    const lm=new Date(now.getFullYear(),now.getMonth()-1,1);start=D.fmt(lm);end=D.fmt(new Date(now.getFullYear(),now.getMonth(),0));title='上月月报';key='month';
  }else return null;
  const days=[];let d=D.parse(start);const e=D.parse(end);
  while(d<=e){days.push(D.fmt(d));d.setDate(d.getDate()+1);}
  const study=DATA.english.filter(r=>days.includes(r.date)).reduce((s,r)=>s+engMins(r),0);
  const exC=DATA.exercise.filter(r=>days.includes(r.date)).length;
  const exMin=DATA.exercise.filter(r=>days.includes(r.date)).reduce((s,r)=>s+(+r.duration||0),0);
  const sideInc=DATA.sideHustle.iso.concat(DATA.sideHustle.media,DATA.sideHustle.other).filter(r=>days.includes(r.date)).reduce((s,r)=>s+(+r.income||0),0);
  const booksDone=DATA.reading.filter(r=>r.status==='done'&&r.doneDate&&days.includes(r.doneDate)).length;
  const cards=`
    <div class="kpi-box"><div class="v">${study}</div><div class="l">学习时长(分)</div></div>
    <div class="kpi-box"><div class="v">${exC}</div><div class="l">运动次数</div></div>
    <div class="kpi-box"><div class="v">${exMin}</div><div class="l">运动分钟</div></div>
    <div class="kpi-box"><div class="v">¥${sideInc.toFixed(0)}</div><div class="l">副业收入</div></div>
    <div class="kpi-box"><div class="v">${booksDone}</div><div class="l">读完本数</div></div>
    <div class="kpi-box"><div class="v">${days.length}</div><div class="l">统计天数</div></div>`;
  return {title:title+'（'+D.pretty(start)+' ~ '+D.pretty(end)+'）',cards,note:DATA.reviews['_'+key+'_'+start]?DATA.reviews['_'+key+'_'+start].summary:''};
}

/* ============================================================
   渲染主入口
   ============================================================ */
function render(){
  const view=document.getElementById('view');
  let html;
  switch(state.view){
    case 'home':html=renderHome();break;
    case 'guide':html=renderGuide();break;
    case 'english':html=renderEnglish();break;
    case 'reading':html=renderReading();break;
    case 'exercise':html=renderExercise();break;
    case 'side':html=renderSide();break;
    case 'media':html=renderMedia();break;
    case 'videos':html=renderVideos();break;
    case 'travel':html=renderTravel();break;
    case 'review':html=renderReview();break;
    default:html=renderHome();
  }
  view.innerHTML=html;
  paintIcons(view);
  bindView(view);
  if(state.view==='home')startSbClock();
  window.scrollTo(0,0);
}

/* ============================================================
   交互绑定
   ============================================================ */
function bindView(view){
  // 打卡墙
  view.querySelectorAll('[data-check]').forEach(el=>el.onclick=()=>{
    const done=toggleCheckin(D.today(),el.dataset.check);el.classList.toggle('done',done);
    el.querySelector('.badge').innerHTML=done?ico('check'):'';
    el.querySelector('.ci-st').textContent=done?'已完成':'待完成';
  });
  // 首页卡片点击跳转
  view.querySelectorAll('[data-jump]').forEach(c=>c.onclick=e=>{
    if(e.target.closest('button,form,input,select,textarea,a'))return;
    setView(c.dataset.jump);if(window.innerWidth<=860)closeSidebar();
  });
  // 表单新增
  view.querySelectorAll('form[data-add]').forEach(form=>form.onsubmit=e=>{
    e.preventDefault();const fd=new FormData(form);const o={};fd.forEach((v,k)=>o[k]=v);
    o.id='r'+Date.now()+Math.random().toString(36).slice(2,6);
    o._t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    const type=form.dataset.add;
    const recTypes=['english','reading','exercise','sideIso','sideMedia','sideOther','mediaPlan','videos'];
    if(recTypes.includes(type)) o.date=o.date||D.today();
    if(type==='english'){push('english',o);toast('已记录英语学习');}
    else if(type==='reading'){push('reading',o);toast('已记录阅读');}
    else if(type==='exercise'){push('exercise',o);toast('已记录运动');}
    else if(type==='sideIso'){push('sideHustle.iso',o);toast('已记录 ISO 审核');}
    else if(type==='sideMedia'){push('sideHustle.media',o);toast('已记录自媒体副业');}
    else if(type==='sideOther'){push('sideHustle.other',o);toast('已记录其他副业');}
    else if(type==='mediaPlan'){push('mediaPlan',o);toast('已添加选题');}
    else if(type==='videos'){push('videos',o);toast('已保存爆款拆解');}
    else if(type==='trip'){
      if(!o.date){toast('请填写出发日期');return;}
      o.id='t'+Date.now();o.plan='';DATA.travel.trips.push(o);save();toast('已添加旅行');
    }
    else if(type==='wish'){o.id='w'+Date.now();o.done=false;DATA.travel.wishlist.push(o);save();toast('已加入愿望清单');}
    else if(type==='itinerary'){o.id='i'+Date.now();DATA.travel.itineraries.push(o);save();toast('已添加预算明细');}
    render();
  });
  // 删除记录
  view.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.del;
    ['english','reading','exercise','mediaPlan','videos','sideHustle.iso','sideHustle.media','sideHustle.other'].forEach(p=>remove(p,r=>r.id===id));
    toast('已删除');render();
  });
  // 侧边 Tab
  view.querySelectorAll('.tab[data-tab]').forEach(t=>t.onclick=()=>{state.sideTab=t.dataset.tab;render();});
  view.querySelectorAll('[data-booktoggle]').forEach(b=>b.onclick=()=>{
    const bk=DATA.reading.find(x=>x.id===b.dataset.booktoggle);
    if(bk){bk.status=bk.status==='done'?'reading':'done';if(bk.status==='done')bk.doneDate=D.today();save();render();}
  });
  // 旅游删除/愿望
  view.querySelectorAll('[data-deltrip]').forEach(b=>b.onclick=()=>{remove('travel.trips',t=>t.id===b.dataset.deltrip);DATA.travel.itineraries=DATA.travel.itineraries.filter(i=>i.tripId!==b.dataset.deltrip);if(DATA.travel.planTrip===b.dataset.deltrip)DATA.travel.planTrip='';save();render();});
  view.querySelectorAll('[data-wishdel]').forEach(b=>b.onclick=()=>{remove('travel.wishlist',w=>w.id===b.dataset.wishdel);render();});
  view.querySelectorAll('[data-wishdone]').forEach(b=>b.onclick=()=>{update('travel.wishlist',w=>w.id===b.dataset.wishdone,{done:true});render();});
  // 旅游：点击某旅行的「编辑行程」→ 切换下拉并滚动到行程规划
  view.querySelectorAll('[data-edittrip]').forEach(b=>b.onclick=()=>{DATA.travel.planTrip=b.dataset.edittrip;save();render();const el=view.querySelector('#planTripSel');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});});
  // 爆款素材卡片：点击展开/收起（修复“打不开内容”）
  view.querySelectorAll('[data-hot]').forEach(c=>{
    const head=c.querySelector('.hot-head'),tg=c.querySelector('.hot-toggle'),body=c.querySelector('.hot-body');
    const toggle=()=>{const open=body.style.display!=='none';body.style.display=open?'none':'block';tg.textContent=open?'点击展开拆解 / 二创脚本 ▾':'收起 ▴';};
    if(head)head.onclick=toggle; if(tg)tg.onclick=toggle;
  });
  // 爆款收藏区：取消收藏
  view.querySelectorAll('[data-favdel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.favdel;if(DATA.favHot&&DATA.favHot[i]){DATA.favHot.splice(i,1);save();toast('已取消收藏');render();}
  });
  // 目标线：编辑目标即时保存
  view.querySelectorAll('[data-goal]').forEach(inp=>inp.onchange=()=>{
    DATA.goals=DATA.goals||{};DATA.goals[inp.dataset.goal]=Math.max(0,+inp.value||0);save();render();
  });
  // 每日单词：点击发音（美式）
  view.querySelectorAll('[data-spk]').forEach(b=>b.onclick=e=>{e.stopPropagation();speakWord(b.dataset.spk);});
  // 每日单词：点击卡片标记「已会」
  view.querySelectorAll('[data-wordtoggle]').forEach(c=>c.onclick=()=>{
    const gi=+c.dataset.wordtoggle; const date=D.today();
    DATA.engWords.done[date]=DATA.engWords.done[date]||[];
    const arr=DATA.engWords.done[date]; const i=arr.indexOf(gi);
    if(i>=0)arr.splice(i,1);else arr.push(gi);
    save();render();
  });
  // 每日单词：一键完成今日打卡
  view.querySelectorAll('[data-daycheck]').forEach(b=>b.onclick=()=>{
    const date=D.today(); const set=todayWordSet();
    DATA.engWords.done[date]=set.map(w=>w.gi);
    save();toast('今日打卡完成 🎉');render();
  });
  // 错词本：加入 / 移出（每日卡片与复习卡片共用）
  view.querySelectorAll('[data-wrong]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const gi=+b.dataset.wrong; const w=DATA.engWords.wrong||(DATA.engWords.wrong=[]);
    const i=w.indexOf(gi); if(i>=0)w.splice(i,1);else w.push(gi);
    save();render();
  });
  // 复习翻牌：点卡片翻面
  view.querySelectorAll('[data-flip]').forEach(c=>c.onclick=()=>{
    const f=c.querySelector('.flip-front'), bk=c.querySelector('.flip-back');
    const showBack=f.style.display!=='none';
    f.style.display=showBack?'none':'block'; bk.style.display=showBack?'block':'none';
  });
  // 复习卡片内发音
  view.querySelectorAll('[data-review-spk]').forEach(b=>b.onclick=e=>{e.stopPropagation();speakWord(b.dataset.reviewSpk);});
  // 复习：记住了 → 移出错词本
  view.querySelectorAll('[data-review-master]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const gi=+b.dataset.reviewMaster; const w=DATA.engWords.wrong||(DATA.engWords.wrong=[]); const i=w.indexOf(gi);
    if(i>=0){w.splice(i,1);save();toast('已从错词本移除 🎉');render();}
  });
  // 实时爆款拉取（女性成长赛道匹配）
  const liveHot=view.querySelector('#liveHot');
  if(liveHot)loadLiveHot(liveHot);
  // 爆款收藏（默认带上自动生成的拆解 + 口播脚本）
  view.querySelectorAll('[data-collect]').forEach(b=>b.onclick=()=>{
    const h=HOT_SEED[+b.dataset.collect];
    const myNote=view.querySelector(`[name="note_${b.dataset.collect}"]`).value;
    const auto='【自动拆解】\n'+genDeconstruct(h)+'\n\n【口播二创脚本】\n'+genScript(h);
    const note=myNote?myNote+'\n\n'+auto:auto;
    push('videos',{id:'r'+Date.now(),date:D.today(),_t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),title:h.title,platform:'参考',note:note});
    toast('已收藏到拆解库');render();
  });
  // 汇率备忘自动保存
  const rates=view.querySelector('[data-rates]');
  if(rates)rates.oninput=()=>{DATA.travel.rates.note=rates.value;save();};
  // 行程规划：下拉切换行程 + 实时解析（仅更新预览，不整页重渲染）
  const planSel=view.querySelector('#planTripSel');
  if(planSel)planSel.onchange=()=>{
    const ta=view.querySelector('#planText');
    const old=DATA.travel.trips.find(t=>t.id===DATA.travel.planTrip);
    if(old&&ta)old.plan=ta.value;
    DATA.travel.planTrip=planSel.value;save();
    const t=DATA.travel.trips.find(x=>x.id===planSel.value);
    if(ta)ta.value=t?t.plan||'':'';
    const prev=view.querySelector('#planPreview');
    if(prev)prev.innerHTML=t?renderPlan(t.plan):'<div class="empty">请先选择旅行</div>';
  };
  const plan=view.querySelector('[data-plan]');
  if(plan)plan.oninput=()=>{const t=DATA.travel.trips.find(x=>x.id===DATA.travel.planTrip);if(t)t.plan=plan.value;save();const prev=view.querySelector('#planPreview');if(prev)prev.innerHTML=renderPlan(plan.value);};
  // 编辑行程按钮：有内容时点击重新显示文本框
  const editBtn=view.querySelector('#planEditBtn');
  if(editBtn)editBtn.onclick=()=>{
    const t=DATA.travel.trips.find(x=>x.id===DATA.travel.planTrip);
    const prev=view.querySelector('#planPreview');
    if(prev&&t){
      prev.innerHTML=`<div class="field"><label>逐日安排（修改后自动更新预览）</label>
        <textarea id="planText" data-plan rows="8">${t.plan||''}</textarea></div>
        <div id="planPreviewInner">${renderPlan(t.plan)}</div>
        <div style="margin-top:8px;text-align:right"><button class="btn sm" id="planSaveBtn">完成编辑 ✓</button></div>`;
      // bind new textarea
      const ta=prev.querySelector('[data-plan]');
      if(ta)ta.oninput=()=>{t.plan=ta.value;save();const inner=prev.querySelector('#planPreviewInner');if(inner)inner.innerHTML=renderPlan(ta.value);};
      const saveBtn=prev.querySelector('#planSaveBtn');
      if(saveBtn)saveBtn.onclick=()=>{save();render();};
    }
  };
  // 复盘心情
  const moods=view.querySelector('#moods');
  if(moods)moods.querySelectorAll('.mood').forEach(m=>m.onclick=()=>{
    moods.querySelectorAll('.mood').forEach(x=>x.classList.remove('sel'));m.classList.add('sel');
    const r=DATA.reviews[D.today()]||{};r.mood=m.dataset.mood;saveReview(D.today(),r);
  });
  const sum=view.querySelector('#reviewSummary');
  if(sum)sum.oninput=()=>{const r=DATA.reviews[D.today()]||{};r.summary=sum.value;saveReview(D.today(),r);};
  const rep=view.querySelector('#reportNote');
  if(rep)rep.oninput=()=>{rep._v=rep.value;};
  const saveRep=view.querySelector('#saveReport');
  if(saveRep)saveRep.onclick=()=>{
    const note=view.querySelector('#reportNote').value;const t=saveRep.dataset.title||'复盘报告';
    DATA.reviews['_last_report']={summary:note,title:t};save();toast('报告已保存');
  };
}

/* ============================================================
   时钟
   ============================================================ */
function startSbClock(){
  clearInterval(sbTimer);
  const tick=()=>{
    const n=new Date();
    const sb=document.getElementById('sbTime');
    if(sb)sb.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  };
  tick();sbTimer=setInterval(tick,30000);
}

/* ============================================================
   主题
   ============================================================ */
function systemPrefersDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
/* 主题优先级：用户手动设置 > 跟随系统。未手动设置过(followSystem=true)则实时跟随系统。 */
function effectiveDark(){
  if(DATA.settings.theme==='dark')return true;
  if(DATA.settings.theme==='light')return false;
  return systemPrefersDark(); // 'system'
}
function applyTheme(){
  const dark=effectiveDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const sys=DATA.settings.theme!=='dark'&&DATA.settings.theme!=='light';
  document.getElementById('themeBtn').innerHTML=`<span class="ico">${ico(dark?'sun':'moon')}</span>${dark?'浅色模式':'深色模式'}${sys?' · 随系统':''}`;
}
/* 手动切换：在 跟随系统 / 浅色 / 深色 之间循环，给用户明确的控制 */
function toggleTheme(){
  const cur=effectiveDark();
  // 当前若由系统决定，先以系统结果作为起点再切换，避免“点了没反应”
  if(DATA.settings.theme!=='dark'&&DATA.settings.theme!=='light'){
    DATA.settings.theme=systemPrefersDark()?'light':'dark';
  }else{
    DATA.settings.theme=DATA.settings.theme==='dark'?'light':'dark';
  }
  save();applyTheme();
}
/* 监听系统主题变化：只要用户没手动锁定，就实时跟随 */
function watchSystemTheme(){
  if(!window.matchMedia)return;
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const handler=()=>{ if(DATA.settings.theme!=='dark'&&DATA.settings.theme!=='light')applyTheme(); };
  if(mq.addEventListener)mq.addEventListener('change',handler);else if(mq.addListener)mq.addListener(handler);
}

/* ============================================================
   侧边栏移动端
   ============================================================ */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

/* ============================================================
   备份菜单
   ============================================================ */
function initBackup(){
  const fab=document.getElementById('fab'),menu=document.getElementById('fabMenu');
  fab.onclick=()=>menu.classList.toggle('open');
  document.addEventListener('click',e=>{if(!fab.contains(e.target)&&!menu.contains(e.target))menu.classList.remove('open');});
  document.getElementById('btnExport').onclick=()=>{
    const blob=new Blob([exportJSON()],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雨宝工作台数据_'+D.today()+'.json';a.click();
    menu.classList.remove('open');toast('已导出 JSON');
  };
  document.getElementById('btnImport').onclick=()=>{document.getElementById('fileInput').click();menu.classList.remove('open');};
  document.getElementById('fileInput').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{importJSON(rd.result);render();toast('数据已恢复');}catch(err){toast('文件格式错误');}};
    rd.readAsText(f);e.target.value='';
  };
  document.getElementById('btnReset').onclick=()=>{
    if(confirm('确定清空全部本地数据？此操作不可恢复！')){resetAll();render();toast('已清空');}
    menu.classList.remove('open');
  };
}

/* ============================================================
   Supabase 配置弹窗
   ============================================================ */
function initSbModal(){
  const modal=document.getElementById('sbModal');
  document.getElementById('connBtn').onclick=()=>{document.getElementById('sbUrl').value=sbCfg?.url||'';document.getElementById('sbKey').value=sbCfg?.key||'';document.getElementById('sbSpace').value=sbCfg?.space||'';modal.classList.add('open');};
  document.getElementById('sbCancel').onclick=()=>modal.classList.remove('open');
  document.getElementById('sbConnect').onclick=()=>{
    sbCfg={url:document.getElementById('sbUrl').value.trim(),key:document.getElementById('sbKey').value.trim(),space:document.getElementById('sbSpace').value.trim()};
    localStorage.setItem(SBKEY,JSON.stringify(sbCfg));modal.classList.remove('open');connectSupabase();
  };
  document.getElementById('sbDisconnect').onclick=()=>{
    sbCfg=null;localStorage.removeItem(SBKEY);sbClient=null;setSbStatus('off');modal.classList.remove('open');toast('已断开云端');
  };
}

/* ============================================================
   快捷键
   ============================================================ */
function initShortcuts(){
  document.addEventListener('keydown',e=>{
    if(e.altKey&&e.key>='1'&&e.key<='9'){
      const m=MODULES[+e.key-1];if(m){setView(m.id);if(window.innerWidth<=860)closeSidebar();}
    }
  });
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  loadSbCfg();
  applyTheme();
  watchSystemTheme();
  paintIcons(document);
  buildNav();
  initBackup();
  initSbModal();
  initShortcuts();
  document.getElementById('themeBtn').onclick=toggleTheme;
  document.getElementById('brand').onclick=()=>setView('home');
  document.getElementById('guideBtn').onclick=()=>{setView('guide');closeSidebar();};
  document.getElementById('menuToggle').onclick=openSidebar;
  document.getElementById('overlay').onclick=closeSidebar;
  setView('home');
  setSbStatus(sbCfg?'sync':'off');
  if(sbCfg)connectSupabase();
}
init();
})();
